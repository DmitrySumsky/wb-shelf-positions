name: Позиции в полках — конкуренты из поисковой выдачи (эксперимент)

# Параллельная ветка к основному `shelves.yml`. Пишет в ЛИСТЫ С СУФФИКСОМ
# «(поиск)» той же таблицы, боевые «Матрица»/«Сводка»/«История» не трогает.
# Расписания намеренно нет: пока прогоняем руками, пока не решим, что выдача
# даёт более полезный список конкурентов, чем ручной.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Запросы через запятую (пусто = лист «Запросы (поиск)»)"
        required: false
      top_n:
        description: "Конкурентов на запрос, если задан queries (по умолчанию 200)"
        required: false
      max_shelves:
        description: "Потолок уникальных полок за прогон (по умолчанию 600)"
        required: false
      dest:
        description: "Регион WB (dest), по умолчанию Москва -1257786"
        required: false

concurrency:
  group: shelf-positions-search
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Собрать конкурентов из выдачи и записать в таблицу
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.queries }}" ]; then
            ARGS="$ARGS --queries '${{ inputs.queries }}'"
          fi
          if [ -n "${{ inputs.top_n }}" ]; then
            ARGS="$ARGS --top-n ${{ inputs.top_n }}"
          fi
          if [ -n "${{ inputs.max_shelves }}" ]; then
            ARGS="$ARGS --max-shelves ${{ inputs.max_shelves }}"
          fi
          if [ -n "${{ inputs.dest }}" ]; then
            ARGS="$ARGS --dest ${{ inputs.dest }}"
          fi
          eval python to_sheets_search.py $ARGS

      - name: Сохранить снапшот как артефакт прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-search-${{ github.run_number }}
          path: |
            snapshot_search.json
          if-no-files-found: ignore
          retention-days: 30
