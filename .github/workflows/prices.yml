name: Цены по артикулам (WB, интрадей)

# Лёгкий срез цен без обхода полок. Дергается cron-job.org каждые 2 часа
# 10:00–20:00 МСК через workflow_dispatch: родному расписанию GitHub доверять
# время нельзя (см. shelves.yml). Повторный запуск в тот же день обновляет
# колонку даты на месте, историю не раздувает.
#
# 10.08.2026 — сюда добавлены книги цен брендов (раньше интрадей обновлял
# только общую книгу, а книги брендов ждали суточного прогона).
# 13.08.2026 — флаг `--no-gradient` убран: градиент теперь приращивается одной
# пачкой правил на новую колонку (v2.2.0), а не пересобирается целиком. Если
# суточный прогон упал, колонку дня заводит интрадей — и она тоже цветная.
# Молчит, пока всё хорошо: в Telegram уходит только падение (договор 10.08).
on:
  workflow_dispatch:
    inputs:
      dest:
        description: "Регион WB (dest), по умолчанию Москва -1257786"
        required: false

concurrency:
  group: shelf-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      # v2.4 (22.09.2026): WB закрыл витрину для облака. Закрыто — интрадей
      # молча пропускается: иначе он каждые 2 часа ставил бы «ошибку сбора»
      # поверх цен, снятых утром из браузера менеджера.
      - name: Пускает ли WB облако
        id: probe
        run: |
          if python browser_job.py probe; then echo "open=true" >> "$GITHUB_OUTPUT"; else echo "open=false" >> "$GITHUB_OUTPUT"; fi

      - name: Снять цены и записать в общую книгу
        if: steps.probe.outputs.open == 'true'
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SOURCE_ID: ${{ secrets.SOURCE_ID }}
        run: python prices_to_sheets.py

      # Книги цен брендов независимы от общей книги: падение одной не должно
      # отменять другую.
      - name: Снять цены и записать в книги брендов
        if: always() && steps.probe.outputs.open == 'true'
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python brand_prices.py --brand all --notify-fail

      - name: Сообщить о падении в Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify.py --fail-title "Интрадей-цены WB: прогон упал" \
            "Журнал: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
