name: Позиции в полках конкурентов (WB)

# Боевой запуск — 08:00 МСК через cron-job.org (тот же аккаунт, что дёргает
# ежедневный отчёт по заказам): workflow_dispatch на этот файл. Родное
# расписание GitHub отключено намеренно — 28.07.2026 оно опоздало на 2,5 часа
# (просили 07:10 МСК, стартовало в 09:36), а полки надо снимать в одно и то же
# время суток, иначе позиции несравнимы между днями.
on:
  workflow_dispatch:
    inputs:
      dest:
        description: "Регион WB (dest), по умолчанию Москва -1257786"
        required: false

concurrency:
  group: shelf-positions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Снять позиции и записать в таблицу
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SOURCE_ID: ${{ secrets.SOURCE_ID }}
        run: |
          python to_sheets.py

      # Цены независимы от позиций: пишем их, даже если сбор полок упал.
      - name: Снять цены и записать в таблицу
        if: always()
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SOURCE_ID: ${{ secrets.SOURCE_ID }}
        run: |
          python prices_to_sheets.py

      # Книга VEXOR (автохимия) — свой источник строк и свой лист «Полки».
      # Независима от двух шагов выше: падение одного не должно ронять остальные.
      - name: Полки в книге VEXOR
        if: always()
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          VEXOR_SHEET_ID: ${{ secrets.VEXOR_SHEET_ID }}
        run: |
          python vexor_shelves.py

      # Отдельные книги брендов (NATURI, SUNSHINE, Health Form, 4ME): список
      # строк ведёт Артур в самом листе «Полки», скрипт только дописывает
      # колонку за сегодня. Один упавший бренд не роняет остальные.
      - name: Полки в книгах брендов
        if: always()
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python brand_shelves.py --brand all

      - name: Сохранить снапшот как артефакт прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_number }}
          path: |
            snapshot.json
            snapshot_prices.json
            snapshot_vexor.json
            snapshot_naturi.json
            snapshot_sunshine.json
            snapshot_health_form.json
            snapshot_4me.json
          if-no-files-found: ignore
          retention-days: 30
